  <path d="M0 205C168 160 329 238 502 198C714 148 919 235 1200 185V260H0Z" fill="#4E8DC0"/>
  <text x="600" y="117" text-anchor="middle" fill="#F3ECC0" stroke="#0D0D11" stroke-width="3" paint-order="stroke" font-family="Impact, Haettenschweiler, sans-serif" font-size="53" letter-spacing="2">THE NEXT SCENE</text>
