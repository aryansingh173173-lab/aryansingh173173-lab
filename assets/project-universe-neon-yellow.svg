<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aryan Singh's project universe</title>
  <desc id="desc">Sixteen public builds travel through four animated transmission lanes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430"><stop stop-color="#06111A"/><stop offset=".5" stop-color="#0B222C"/><stop offset="1" stop-color="#07151E"/></linearGradient>
    <linearGradient id="beam" x1="50" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FF4D4D" stop-opacity="0"/><stop offset=".22" stop-color="#FF4D4D"/><stop offset=".5" stop-color="#F7F6F2"/><stop offset=".78" stop-color="#5CE1FF"/><stop offset="1" stop-color="#5CE1FF" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="stars" width="68" height="49" patternUnits="userSpaceOnUse"><circle cx="9" cy="12" r="1" fill="#5CE1FF" opacity=".34"/><circle cx="45" cy="35" r="1" fill="#F7F6F2" opacity=".25"/><circle cx="65" cy="8" r=".8" fill="#FF4D4D" opacity=".38"/></pattern>
  </defs>
  <style>
    [fill="#06111A"], [fill="#07151E"], [fill="#0B202A"], [fill="#0B222C"] { fill: #0D0D11; }
    [fill="#FF4D4D"], [fill="#5CE1FF"], [fill="#F7F6F2"] { fill: #F1FF0A; }
    [fill="#91A9B7"] { fill: #F1FF0A; fill-opacity: .58; }
    [stroke="#FF4D4D"], [stroke="#5CE1FF"], [stroke="#F7F6F2"] { stroke: #F1FF0A; }
    stop[stop-color="#06111A"], stop[stop-color="#07151E"], stop[stop-color="#0B222C"] { stop-color: #0D0D11; }
    stop[stop-color="#FF4D4D"], stop[stop-color="#5CE1FF"], stop[stop-color="#F7F6F2"] { stop-color: #F1FF0A; }
    .lane-a { animation: driftA 7s ease-in-out infinite alternate; }
    .lane-b { animation: driftB 8s ease-in-out infinite alternate; }
    .lane-c { animation: driftA 9s ease-in-out infinite alternate-reverse; }
    .lane-d { animation: driftB 6s ease-in-out infinite alternate-reverse; }
    .beam { animation: beam 4s linear infinite; }
    .node { animation: node 2.6s ease-in-out infinite; }
    .blink { animation: blink 1s steps(2,end) infinite; }
    @keyframes driftA { to { transform: translateX(24px); } }
    @keyframes driftB { to { transform: translateX(-22px); } }
    @keyframes beam { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -110; } }
    @keyframes node { 0%,100% { opacity:.82; } 50% { opacity:1; filter:drop-shadow(0 0 6px #F1FF0A); } }
    @keyframes blink { 50% { opacity: .15; } }
  </style>
  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="26" fill="url(#stars)"/>
  <rect x="1" y="1" width="1198" height="428" rx="25" fill="none" stroke="#5CE1FF" stroke-opacity=".3"/>
  <text x="54" y="51" fill="#FF4D4D" font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="3">PROJECT UNIVERSE // 16 SIGNALS ONLINE</text>
  <text x="1148" y="51" text-anchor="end" fill="#91A9B7" font-family="Consolas, monospace" font-size="11">REPOSITORY TELEMETRY <tspan class="blink" fill="#5CE1FF">●</tspan></text>
  <g stroke="url(#beam)" stroke-width="2" stroke-dasharray="12 10" class="beam" opacity=".62"><path d="M36 110H1164"/><path d="M36 194H1164"/><path d="M36 278H1164"/><path d="M36 362H1164"/></g>

  <g class="lane-a" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <g transform="translate(182 110)" class="node"><rect x="-115" y="-24" width="230" height="48" rx="24" fill="#0B202A" stroke="#FF4D4D"/><circle cx="-92" r="5" fill="#FF4D4D"/><text x="8" y="5" fill="#F7F6F2">bks-bengal</text></g>
    <g transform="translate(455 110)" class="node"><rect x="-112" y="-24" width="224" height="48" rx="24" fill="#0B202A" stroke="#5CE1FF"/><circle cx="-89" r="5" fill="#5CE1FF"/><text x="8" y="5" fill="#F7F6F2">krl-site</text></g>
    <g transform="translate(743 110)" class="node"><rect x="-128" y="-24" width="256" height="48" rx="24" fill="#0B202A" stroke="#FF4D4D"/><circle cx="-105" r="5" fill="#FF4D4D"/><text x="8" y="5" fill="#F7F6F2">bks-pujo-part-2</text></g>
    <g transform="translate(1030 110)" class="node"><rect x="-105" y="-24" width="210" height="48" rx="24" fill="#0B202A" stroke="#5CE1FF"/><circle cx="-82" r="5" fill="#5CE1FF"/><text x="8" y="5" fill="#F7F6F2">new-site</text></g>
  </g>
  <g class="lane-b" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <g transform="translate(177 194)" class="node"><rect x="-110" y="-24" width="220" height="48" rx="24" fill="#0B202A" stroke="#5CE1FF"/><circle cx="-87" r="5" fill="#5CE1FF"/><text x="8" y="5" fill="#F7F6F2">bks-pujo</text></g>
    <g transform="translate(462 194)" class="node"><rect x="-138" y="-24" width="276" height="48" rx="24" fill="#0B202A" stroke="#FF4D4D"/><circle cx="-115" r="5" fill="#FF4D4D"/><text x="8" y="5" fill="#F7F6F2">krl-teams-redesign</text></g>
    <g transform="translate(753 194)" class="node"><rect x="-122" y="-24" width="244" height="48" rx="24" fill="#0B202A" stroke="#5CE1FF"/><circle cx="-99" r="5" fill="#5CE1FF"/><text x="8" y="5" fill="#F7F6F2">gravity-rsvp</text></g>
    <g transform="translate(1034 194)" class="node"><rect x="-156" y="-24" width="312" height="48" rx="24" fill="#0B202A" stroke="#FF4D4D"/><circle cx="-133" r="5" fill="#FF4D4D"/><text x="8" y="5" fill="#F7F6F2">krl-media-connect-redesign</text></g>
  </g>
  <g class="lane-c" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <g transform="translate(188 278)" class="node"><rect x="-165" y="-24" width="330" height="48" rx="24" fill="#0B202A" stroke="#FF4D4D"/><circle cx="-142" r="5" fill="#FF4D4D"/><text x="8" y="5" fill="#F7F6F2">pravasi-krishi-bandhu-cinematic</text></g>
    <g transform="translate(494 278)" class="node"><rect x="-122" y="-24" width="244" height="48" rx="24" fill="#0B202A" stroke="#5CE1FF"/><circle cx="-99" r="5" fill="#5CE1FF"/><text x="8" y="5" fill="#F7F6F2">bks-pujo-demo</text></g>
    <g transform="translate(782 278)" class="node"><rect x="-126" y="-24" width="252" height="48" rx="24" fill="#0B202A" stroke="#FF4D4D"/><circle cx="-103" r="5" fill="#FF4D4D"/><text x="8" y="5" fill="#F7F6F2">Aryan-Film-making</text></g>
    <g transform="translate(1060 278)" class="node"><rect x="-105" y="-24" width="210" height="48" rx="24" fill="#0B202A" stroke="#5CE1FF"/><circle cx="-82" r="5" fill="#5CE1FF"/><text x="8" y="5" fill="#F7F6F2">Sreenived-cv</text></g>
  </g>
  <g class="lane-d" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <g transform="translate(174 362)" class="node"><rect x="-116" y="-24" width="232" height="48" rx="24" fill="#0B202A" stroke="#5CE1FF"/><circle cx="-93" r="5" fill="#5CE1FF"/><text x="8" y="5" fill="#F7F6F2">bolt-new-repo</text></g>
    <g transform="translate(465 362)" class="node"><rect x="-132" y="-24" width="264" height="48" rx="24" fill="#0B202A" stroke="#FF4D4D"/><circle cx="-109" r="5" fill="#FF4D4D"/><text x="8" y="5" fill="#F7F6F2">portfolio-website</text></g>
    <g transform="translate(758 362)" class="node"><rect x="-125" y="-24" width="250" height="48" rx="24" fill="#0B202A" stroke="#5CE1FF"/><circle cx="-102" r="5" fill="#5CE1FF"/><text x="8" y="5" fill="#F7F6F2">aryans.github.io</text></g>
    <g transform="translate(1044 362)" class="node"><rect x="-104" y="-24" width="208" height="48" rx="24" fill="#0B202A" stroke="#FF4D4D"/><circle cx="-81" r="5" fill="#FF4D4D"/><text x="8" y="5" fill="#F7F6F2">aryans</text></g>
  </g>
</svg>
