<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">From first frame to live experience</title>
  <desc id="desc">An animated four-scene journey through story, design, build, and launch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420"><stop stop-color="#06111A"/><stop offset=".5" stop-color="#0A202A"/><stop offset="1" stop-color="#07151E"/></linearGradient>
    <linearGradient id="rail" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FF4D4D"/><stop offset=".5" stop-color="#F7F6F2"/><stop offset="1" stop-color="#5CE1FF"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5CE1FF" stroke-opacity=".055"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="storyRail" d="M98 214 C205 214 205 155 322 155 S448 275 563 275 S706 150 812 150 S968 218 1102 218"/>
  </defs>
  <style>
    .dash { animation: dash 7s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .type-a { animation: typeA 5s steps(4,end) infinite; }
    .type-b { animation: typeB 5s steps(4,end) infinite; }
    .spin { animation: spin 12s linear infinite; transform-box: fill-box; transform-origin: center; }
    .launch { animation: launch 3s ease-in-out infinite; }
    .blink { animation: blink 1s steps(2,end) infinite; }
    @keyframes dash { to { stroke-dashoffset: -150; } }
    @keyframes pulse { 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes typeA { 0%,15% { width: 0 } 45%,100% { width: 100px } }
    @keyframes typeB { 0%,30% { width: 0 } 65%,100% { width: 126px } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes launch { 50% { transform: translate(8px,-12px); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="url(#rail)" stroke-opacity=".42"/>
  <text x="54" y="53" fill="#5CE1FF" font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="3">THE BUILD JOURNEY // FOUR MOVING SCENES</text>
  <text x="1145" y="53" text-anchor="end" fill="#91A9B7" font-family="Consolas, monospace" font-size="12">PLAYING ON LOOP <tspan class="blink" fill="#FF4D4D">●</tspan></text>
  <use href="#storyRail" fill="none" stroke="#173845" stroke-width="10" stroke-linecap="round"/>
  <use href="#storyRail" fill="none" stroke="url(#rail)" stroke-width="3" stroke-dasharray="11 14" stroke-linecap="round" class="dash"/>
  <circle r="9" fill="#F7F6F2" stroke="#5CE1FF" stroke-width="4" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#storyRail"/></animateMotion>
  </circle>

  <g transform="translate(98 214)" class="pulse">
    <circle r="67" fill="#0B202A" stroke="#FF4D4D" stroke-width="2"/>
    <rect x="-34" y="-24" width="68" height="48" rx="8" fill="none" stroke="#F7F6F2" stroke-width="3"/>
    <path d="M-34-24L-17-43H51L34-24M-19-43L-1-24M8-43L25-24" fill="none" stroke="#FF4D4D" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#5CE1FF" stroke-width="3"/>
  </g>
  <g transform="translate(322 155)">
    <circle r="67" fill="#0B202A" stroke="#F7F6F2" stroke-opacity=".55" stroke-width="2"/>
    <circle r="41" fill="none" stroke="#FF4D4D" stroke-width="2" stroke-dasharray="8 8" class="spin"/>
    <path d="M-28 16L0-31L28 16Z" fill="#5CE1FF" fill-opacity=".14" stroke="#5CE1FF" stroke-width="3"/>
    <circle cy="4" r="12" fill="#FF4D4D"/>
  </g>
  <g transform="translate(563 275)">
    <circle r="67" fill="#0B202A" stroke="#5CE1FF" stroke-width="2"/>
    <rect x="-43" y="-34" width="86" height="68" rx="8" fill="#06111A" stroke="#91A9B7"/>
    <circle cx="-30" cy="-22" r="3" fill="#FF4D4D"/><circle cx="-20" cy="-22" r="3" fill="#F7F6F2"/><circle cx="-10" cy="-22" r="3" fill="#5CE1FF"/>
    <rect class="type-a" x="-29" y="-8" width="58" height="5" rx="2.5" fill="#FF4D4D"/>
    <rect class="type-b" x="-29" y="7" width="38" height="5" rx="2.5" fill="#5CE1FF"/>
    <rect x="-29" y="22" width="48" height="5" rx="2.5" fill="#F7F6F2" opacity=".55"/>
  </g>
  <g transform="translate(812 150)">
    <circle r="67" fill="#0B202A" stroke="#FF4D4D" stroke-width="2"/>
    <rect x="-45" y="-34" width="90" height="68" rx="8" fill="#06111A" stroke="#F7F6F2"/>
    <path d="M-45-20H45" stroke="#F7F6F2" opacity=".5"/><circle cx="-33" cy="-27" r="3" fill="#FF4D4D"/><circle cx="-23" cy="-27" r="3" fill="#5CE1FF"/>
    <rect x="-32" y="-8" width="64" height="28" rx="5" fill="#5CE1FF" fill-opacity=".14" stroke="#5CE1FF"/>
    <path d="M-22 12L-7-2L6 8L17-7L27 12" fill="none" stroke="#FF4D4D" stroke-width="2"/>
  </g>
  <g transform="translate(1102 218)" class="launch">
    <circle r="67" fill="#0B202A" stroke="#5CE1FF" stroke-width="2"/>
    <path d="M-14 15C-28 32-29 42-29 42S-16 40-2 27M16-16C35-9 43 11 43 11L11 43C11 43-9 35-16 16C-11-1-1-11 16-16Z" fill="#F7F6F2" stroke="#5CE1FF" stroke-width="3"/>
    <circle cx="13" cy="9" r="8" fill="#06111A" stroke="#FF4D4D" stroke-width="3"/>
    <path d="M-9 29L-25 45M1 39L-8 54" stroke="#FF4D4D" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.6">
    <text x="98" y="311" fill="#FF4D4D">01 / STORY</text><text x="98" y="332" fill="#91A9B7" font-size="10">FIND THE HUMAN BEAT</text>
    <text x="322" y="257" fill="#F7F6F2">02 / FRAME</text><text x="322" y="278" fill="#91A9B7" font-size="10">DIRECT THE WORLD</text>
    <text x="563" y="376" fill="#5CE1FF">03 / BUILD</text><text x="563" y="397" fill="#91A9B7" font-size="10">CODE THE RHYTHM</text>
    <text x="812" y="252" fill="#FF4D4D">04 / EXPERIENCE</text><text x="812" y="273" fill="#91A9B7" font-size="10">MAKE IT FEEL ALIVE</text>
    <text x="1102" y="319" fill="#5CE1FF">05 / LAUNCH</text><text x="1102" y="340" fill="#91A9B7" font-size="10">SEND IT INTO THE WORLD</text>
  </g>
</svg>
