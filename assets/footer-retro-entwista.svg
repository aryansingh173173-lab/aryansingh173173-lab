  <text x="600" y="226" text-anchor="middle" fill="#F3ECC0" font-family="Arial Black, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="5">DIRECTED • DESIGNED • DEVELOPED BY ARYAN SINGH</text>
