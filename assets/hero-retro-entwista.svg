<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aryan Singh — story director and experience builder</title>
  <desc id="desc">A retro animated title card in blue, orange, yellow and cream.</desc>
  <defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="9" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="fade"><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="fade" mode="multiply"/>
  </filter></defs>
  <style>
    .sun { animation: sun 8s ease-in-out infinite; transform-origin: 600px 248px; }
    .title-shadow { animation: shadow 3.8s ease-in-out infinite; }
    .spark { animation: blink 2.2s steps(2,end) infinite; }
    .ticker { animation: drift 7s ease-in-out infinite alternate; }
    @keyframes sun { 50% { transform:rotate(8deg) scale(1.035); } }
    @keyframes shadow { 50% { transform:translate(7px,7px); } }
    @keyframes blink { 50% { opacity:.25; transform:scale(.75); } }
    @keyframes drift { to { transform:translateX(34px); } }
    @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
  </style>
  <rect width="1200" height="520" fill="#4E8DC0"/>
  <g class="sun" opacity=".38" fill="#F3ECC0">
    <rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(0 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(20 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(40 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(60 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(80 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(100 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(120 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(140 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(160 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(180 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(200 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(220 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(240 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(260 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(280 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(300 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(320 600 248)"/><rect x="594" y="-95" width="12" height="265" rx="6" transform="rotate(340 600 248)"/>
  </g>
  <circle cx="600" cy="250" r="174" fill="#F9C82D"/>
  <circle cx="600" cy="250" r="147" fill="#FC5012"/>
  <path d="M0 416 C185 360 315 477 493 425 C695 365 868 479 1200 395 V520 H0Z" fill="#F3ECC0"/>
  <path d="M0 450 C190 397 341 500 548 452 C780 398 965 479 1200 430 V520 H0Z" fill="#F9C82D"/>
  <g class="title-shadow" fill="#FC5012" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-weight="900" text-anchor="middle">
    <text x="606" y="245" font-size="154" letter-spacing="-3">ARYAN</text>
    <text x="606" y="371" font-size="154" letter-spacing="-3">SINGH</text>
  </g>
  <g fill="#F3ECC0" stroke="#0D0D11" stroke-width="4" paint-order="stroke" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-weight="900" text-anchor="middle">
    <text x="594" y="233" font-size="154" letter-spacing="-3">ARYAN</text>
    <text x="594" y="359" font-size="154" letter-spacing="-3">SINGH</text>
  </g>
  <g class="spark" fill="#F3ECC0" stroke="#0D0D11" stroke-width="3">
    <path d="M95 89h22l7-22 7 22h22l-18 13 7 22-18-14-18 14 7-22z"/>
    <path d="M1050 80h18l6-18 6 18h18l-15 11 6 18-15-11-15 11 6-18z"/>
  </g>
  <rect x="310" y="398" width="580" height="52" rx="26" fill="#0D0D11"/>
  <text x="600" y="432" fill="#F3ECC0" font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="4" text-anchor="middle">STORY DIRECTOR × EXPERIENCE BUILDER</text>
  <g class="ticker" fill="#0D0D11" font-family="Arial Black, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">
    <text x="-28" y="494">FILM  ✦  CODE  ✦  CULTURE  ✦  MOTION  ✦  FILM  ✦  CODE  ✦  CULTURE  ✦  MOTION  ✦  FILM  ✦  CODE  ✦  CULTURE  ✦  MOTION</text>
  </g>
  <rect width="1200" height="520" fill="transparent" filter="url(#grain)" opacity=".32"/>
</svg>